name: Deploy to Cloudflare Pages

# Builds the expense-tracker PWA and deploys it to Cloudflare Pages on every push
# to the feature branch. Cloudflare serves at the root of *.pages.dev, so the app
# is built with the default base path ('/'). Requires two repo secrets:
#   - CLOUDFLARE_API_TOKEN  (permission: Account › Cloudflare Pages › Edit)
#   - CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [claude/expense-tracker-pwa-5lc34f]
    paths:
      - 'app/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build app
        working-directory: app
        run: npm run build

      # Create the Pages project on first run; harmless (and ignored) if it exists.
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create tx-showcase-expenses --production-branch=production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=production matches the project's production branch, so this
          # publishes to the stable https://tx-showcase-expenses.pages.dev URL.
          command: pages deploy app/dist --project-name=tx-showcase-expenses --branch=production
